<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>練習ページ: 宛名検索</title>
<style>
  body { font-family: "Meiryo", sans-serif; margin: 0; }
  .app-header { background: #2d4a6e; padding: 8px 16px; }
  .nav-link { color: #fff; text-decoration: none; }
  main { padding: 16px; }
  .atena-input { width: 220px; padding: 4px; }
  .suggest-overlay { position: absolute; background: #fff; border: 1px solid #999; min-width: 220px; z-index: 1000; }
  .suggest-overlay ul { list-style: none; margin: 0; padding: 0; }
  .suggest-option { padding: 4px 8px; cursor: pointer; }
  .suggest-option:hover { background: #dde8f5; }
  .p-datatable { border-collapse: collapse; margin-top: 12px; }
  .p-datatable td, .p-datatable th { border: 1px solid #ccc; padding: 4px 12px; }
  .p-selectable-row { cursor: pointer; }
  .p-selectable-row:hover, .p-selectable-row.p-highlight { background: #dde8f5; }
  .empty { color: #888; }
  .tabs { display: flex; gap: 4px; margin: 12px 0; }
  .tab { border: 1px solid #999; padding: 4px 12px; cursor: pointer; }
  .tab-body { border: 1px solid #ccc; padding: 12px; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #ccc; border-top-color: #2d4a6e; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview { border: 2px solid #2d4a6e; padding: 24px; background: #fffbe6; }
</style>
</head>
<body>
<!--
  cas_cap のバッチ用記録（宛名番号を入力 → 検索 → 対象者一覧の行を選択）を検証するための練習ページ。
  実在システムの値は使っていない。業務システムで見られる次の作りを再現している。
    1. 宛名番号をキー入力すると、少し遅れてサジェスト（候補）が出る（キーを離した時だけ動く）。
       候補を選ぶと一覧を飛ばして詳細へ進む。候補の外をクリックすると閉じる
    2. 「検索」ボタンで対象者一覧を出す。一覧は前方一致（11111 で 111119 も出る）。行は tr.p-selectable-row
       URL は変えない（業務システムのポストバックを模す）
    3. 行をクリックすると詳細へ。URL には宛名番号ではなく世帯番号と内部キーが入る
    4. 詳細の「帳票」タブを押すと帳票プレビューの作成が始まり、約3秒「くるくる」が出る。くるくるは回るだけで
       画面の中身（DOM）を変えない。作成中はメニュー（宛名検索）を押しても効かない
  ?label=name を付けると、一覧・候補の表示が氏名だけ（宛名番号なし）になる。
  画面の動きは window.__mockLog に積まれる（検証用）。
-->
<header class="app-header"><a href="#/search" class="nav-link">宛名検索</a></header>
<main id="view"></main>
<script>
(function () {
  var labelMode = new URLSearchParams(location.search).get('label') === 'name' ? 'name' : 'number';
  var PEOPLE = [
    { atena: '11111',  name: '山田 太郎', setai: '90001', key: 'k7f3' },
    { atena: '111119', name: '田中 次郎', setai: '90004', key: 'k1a9' },
    { atena: '222222', name: '佐藤 花子', setai: '90002', key: 'k5c2' },
    { atena: '333333', name: '鈴木 一郎', setai: '90003', key: 'k9d8' }
  ];
  window.__mockLog = [];
  var busy = false;
  var overlay = null, timer = null;

  function rid() { return 'pv_id_' + Math.floor(Math.random() * 1000); }
  function labelOf(p) { return labelMode === 'name' ? p.name : (p.atena + ' ' + p.name); }
  function hits(v) { return PEOPLE.filter(function (p) { return p.atena.indexOf(v) === 0; }); }
  function closeOverlay() { if (overlay) { overlay.remove(); overlay = null; } }
  function openDetail(p) {
    // 少し遅れて遷移。URL には世帯番号と内部キー
    setTimeout(function () { location.hash = '#/detail?setai=' + p.setai + '&k=' + p.key; }, 300);
  }

  function render() {
    closeOverlay();
    var h = location.hash || '#/search';
    var view = document.getElementById('view');

    if (h.indexOf('#/detail') === 0) {
      var q = new URLSearchParams(h.split('?')[1] || '');
      var p = PEOPLE.filter(function (x) { return x.key === q.get('k'); })[0];
      if (!p) { view.innerHTML = '<p>対象がありません</p>'; return; }
      view.innerHTML =
        '<section class="detail"><h2>宛名詳細</h2>' +
        '<p class="person">宛名番号 <span class="atena">' + p.atena + '</span> ／ 氏名 <span class="name">' + p.name + '</span></p>' +
        '<div class="tabs"><div class="tab" data-tab="基本">基本</div><div class="tab" data-tab="履歴">履歴</div><div class="tab" data-tab="世帯">世帯</div><div class="tab" data-tab="帳票">帳票</div></div>' +
        '<div class="tab-body">基本: ' + p.name + '</div></section>';
      window.__mockLog.push({ view: 'detail', atena: p.atena });
      Array.prototype.forEach.call(view.querySelectorAll('.tab'), function (t) {
        t.addEventListener('click', function () {
          if (t.dataset.tab === '帳票') { startPreview(view, p); return; }
          view.querySelector('.tab-body').textContent = t.dataset.tab + ': ' + p.name;
          window.__mockLog.push({ view: 'tab', atena: p.atena, tab: t.dataset.tab });
        });
      });
      return;
    }

    var id = rid();
    view.innerHTML =
      '<section class="search"><h2>宛名検索</h2>' +
      '<label for="' + id + '_input">宛名番号</label> <input id="' + id + '_input" class="atena-input" autocomplete="off"> ' +
      '<button type="button" class="p-button search-button" aria-label="検索">検索</button>' +
      '<div class="result"></div></section>';
    var input = view.querySelector('.atena-input');
    // サジェスト: キーを離した時だけ、少し遅れて出る
    input.addEventListener('keyup', function () {
      clearTimeout(timer);
      var v = input.value.trim();
      if (!v) { closeOverlay(); return; }
      timer = setTimeout(function () { suggest(input, v); }, 300);
    });
    view.querySelector('.search-button').addEventListener('click', function () { search(view, input.value.trim()); });
  }

  function suggest(input, v) {
    setTimeout(function () {                       // サーバ問い合わせの代わり
      if (input.value.trim() !== v || !document.body.contains(input)) return;
      var list = hits(v);
      closeOverlay();
      if (!list.length) return;
      overlay = document.createElement('div');
      overlay.className = 'suggest-overlay';
      overlay.id = rid() + '_list';
      var r = input.getBoundingClientRect();
      overlay.style.left = (r.left + window.scrollX) + 'px';
      overlay.style.top = (r.bottom + window.scrollY) + 'px';
      var ul = document.createElement('ul');
      ul.setAttribute('role', 'listbox');
      list.forEach(function (p, idx) {
        var li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.className = 'suggest-option';
        li.id = overlay.id + '_' + idx;
        li.textContent = labelOf(p);
        li.addEventListener('click', function () {
          input.value = labelOf(p);
          closeOverlay();
          window.__mockLog.push({ view: 'suggest-pick', atena: p.atena });
          openDetail(p);
        });
        ul.appendChild(li);
      });
      overlay.appendChild(ul);
      document.body.appendChild(overlay);
    }, 400);
  }
  // 候補の外をクリックしたら閉じる
  document.addEventListener('mousedown', function (e) {
    if (overlay && !overlay.contains(e.target)) closeOverlay();
  }, true);

  function search(view, v) {
    closeOverlay();
    var box = view.querySelector('.result');
    box.innerHTML = '<p class="empty">検索中…</p>';
    setTimeout(function () {                       // サーバ問い合わせの代わり
      var list = v ? hits(v) : [];
      window.__mockLog.push({ view: 'list', query: v, count: list.length });
      if (!list.length) { box.innerHTML = '<p class="empty">該当する対象者はいません</p>'; return; }
      var table = document.createElement('table');
      table.className = 'p-datatable';
      table.innerHTML = '<thead><tr><th>' + (labelMode === 'name' ? '氏名' : '宛名番号・氏名') + '</th></tr></thead>';
      var tbody = document.createElement('tbody');
      list.forEach(function (p) {
        var tr = document.createElement('tr');
        tr.className = 'p-selectable-row';
        tr.setAttribute('tabindex', '0');
        var td = document.createElement('td');
        td.textContent = labelOf(p);
        tr.appendChild(td);
        tr.addEventListener('click', function () {
          tr.classList.add('p-highlight');
          window.__mockLog.push({ view: 'select', atena: p.atena });
          openDetail(p);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      box.innerHTML = '';
      box.appendChild(table);
    }, 500);
  }

  // 帳票プレビューの作成。くるくるを出したら、完成までDOMは変えない
  function startPreview(view, p) {
    var body = view.querySelector('.tab-body');
    busy = true;
    body.innerHTML = '<span class="spinner"></span> 帳票プレビュー作成中…';
    window.__mockLog.push({ view: 'preview-start', atena: p.atena });
    setTimeout(function () {
      busy = false;
      if (!document.body.contains(body)) return;
      body.innerHTML = '<div class="preview">帳票プレビュー<br>宛名番号 ' + p.atena + ' ／ 氏名 ' + p.name + '</div>';
      window.__mockLog.push({ view: 'preview', atena: p.atena });
    }, 3000);
  }
  // 作成中はメニューを押しても効かない
  document.querySelector('.nav-link').addEventListener('click', function (e) {
    if (busy) { e.preventDefault(); window.__mockLog.push({ view: 'ignored' }); return; }
    // 検索画面にいる時に押しても、画面を初期状態に戻す（URLが同じでも描き直す）
    if ((location.hash || '#/search') === '#/search') { e.preventDefault(); render(); }
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
